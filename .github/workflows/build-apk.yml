
name: Build Arcane Songcraft APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Build APK
        run: gradle -p project/arcane-songcraft-android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcane-Songcraft-APK
          path: project/arcane-songcraft-android/app/build/outputs/apk/debug/app-debug.apk
